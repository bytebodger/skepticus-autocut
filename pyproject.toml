[project]
name = "skepticus-autocut"
version = "0.1.0"
description = "Automated video editing pipeline: raw MP4 in, cut/graded/captioned video out."
requires-python = ">=3.12,<3.13"

# Determinism: pin everything that touches transcription output. See spec section 15.
# faster-whisper and ctranslate2 are a version-sensitive pair; pin both exactly.
# faster-whisper 1.2.1 requires ctranslate2<5,>=4.0 and is verified against 4.5.0.
dependencies = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.5.0",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "jinja2==3.1.5",
    "setuptools<81", # ctranslate2 4.5.0 imports pkg_resources, removed in setuptools 82
    "requests",        # faster-whisper imports it but doesn't declare it
    "python-multipart",
    "pyyaml",          # config/layout.yaml for the phase-2 compositor
    "anthropic",       # LLM shot-list authoring (phase-3 visuals)
    "numpy",           # placeholder image backend + PNG encoding (phase-3 visuals)
    "websockets",      # drives headless Chrome over CDP for the render stage (phase-3 visuals)
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]
# CUDA runtime DLLs for GPU transcription on Windows. ctranslate2 needs
# cublas64_12.dll / cudnn64_9.dll; the extension can't find them via PATH on
# Python 3.8+, so transcribe.py registers these packages' bin dirs with
# os.add_dll_directory at import. Install with: pip install -e .[cuda]
cuda = [
    "nvidia-cublas-cu12==12.*",
    "nvidia-cudnn-cu12==9.*",
]
# Hosted, reference-image-conditioned illustration backend (phase-3 visuals).
# The default backend in config/layout.yaml; needs GEMINI_API_KEY at runtime.
# The offline `placeholder` backend needs none of this. Install: pip install -e .[gemini]
gemini = [
    "google-genai",
]

[project.scripts]
autocut = "autocut.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["autocut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
