# Phase-2 compositor layout (compositor spec section 2).
# Every geometry value lives here — nothing is hardcoded in the pipeline.
# Move the speaker to the left, resize the content window, etc. by editing this
# file and re-running `autocut compose <episode>`.

# Swappable per-episode visual style — a directory styles/<name>/ holding
# STYLE.md, style.yaml, tokens.css, and references/ (visuals spec section 3).
style: default

# Illustration generation (visuals spec sections 4, 8, 9).
visuals:
  backend: gemini           # gemini (hosted, reference-conditioned) | placeholder
  candidates: 4             # candidates generated per illustration shot
  size: [1536, 1024]        # width, height

canvas:
  width: 3840
  height: 2160
  fps: from_source          # never hardcode; read from probe.json

background:
  # Real 3840x2160 background. (A labelled grid placeholder also lives at
  # assets/backgrounds/placeholder_bg.png if you want to eyeball exact pixels.)
  image: assets/backgrounds/fiery-background-4k.png

speaker:
  # Which side the speaker window sits on. This is the single knob for window
  # placement: both rects' x origins derive from it (autocut.layout.rect), so
  # flipping right<->left swaps the speaker and content windows together without
  # overlap or gap. Speaker is on the left so my slight rightward eyeline reads as
  # looking toward the content rather than off-screen. The x in each rect below is
  # authored for this side; it is recomputed when the side flips.
  side: left                # left | right
  rect: [160, 240, 1080, 1680]      # x, y, w, h in canvas space
  # Explicit crop measured from a real frame on this rig (x offset 636), rather
  # than the centred value the spec assumes. [x, y, w, h] in source space.
  source_crop: [636, 0, 1389, 2160]
  key:
    enabled: false         # recording against a black backdrop now — no key.
    color: "0x00b140"       # kept for the green-screen path behind the flag.
    similarity: 0.12
    blend: 0.05
    despill: true
  corner_radius: 24         # rounded window via pre-rendered mask + alphamerge
  border:                   # subtle framing so the window reads as intentional
    width: 5
    color: "#f0f0f4"
  shadow:                   # soft drop shadow to lift the window off the bg
    enabled: true
    opacity: 0.55
    blur: 18
    offset: [0, 10]         # dx, dy in canvas px

content:
  # x here (1320) is the right-hand slot that pairs with speaker.side: left; it is
  # derived from speaker.side, not authored independently. w/h/y are authoritative.
  rect: [1320, 240, 2400, 1680]     # x, y, w, h in canvas space
  fit: contain              # contain (letterbox) | cover (fill + crop)
  background: "#0b0b0d"     # letterbox fill when fit=contain
  # hold keeps the content window covered continuously: each card holds its final
  # frame until the next card starts, so the window is never empty next to the
  # talking head. Both modes keep the track transparent (alpha cards compose over
  # the background); background instead lets the wallpaper show between cards.
  # Coverage is continuous by construction (authoring makes shot durations
  # contiguous); hold is the backstop.
  gap_behavior: hold        # hold (last item stays) | background (wallpaper shows)
  transition:
    type: crossfade         # crossfade | cut
    duration: 0.35
  # Fallback still shown in the content rect when there is no content.json.
  placeholder: assets/placeholder_content.png

audio:                      # deterministic audio chain (spec section 7)
  # Off by default: the processed chain reads slightly muffled next to DaVinci's
  # Audio Assistant, so audio is finished in the NLE instead. When disabled the
  # source audio is mapped through untouched (no highpass/afftdn/compressor/
  # loudnorm). Flip to true to re-enable the full chain below.
  enabled: false
  highpass: 80              # Hz — kills rumble / HVAC
  afftdn:
    nf: -25                 # noise floor dB — gentle broadband denoise
  compressor:
    threshold: -18          # dB
    ratio: 3
    attack: 5               # ms
    release: 120            # ms
  loudnorm:                 # two-pass, YouTube target
    I: -14
    TP: -1.5
    LRA: 11

captions:
  enabled: true
  font: Arial               # must be installed / in styles/ for the burn
  font_size: 100            # tuned for 4K; a 1080p size reads tiny here
  margin_bottom: 100        # px from the bottom of the canvas
  outline: 4
  shadow: 3
  outline_color: "#000000"
  word_highlight:
    base_color: "#FFFFFF"       # not-yet-spoken (white)
    highlight_color: "#40FF40"  # current/spoken word (bright green)
