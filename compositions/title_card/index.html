<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
  * { box-sizing: border-box; font-family: "Montserrat", system-ui, sans-serif; }
  .wrap {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    animation: fade 5s ease-in-out both;
  }
  .title    { font-size: 120px; font-weight: 900; color: #fff; text-shadow: 0 6px 40px rgba(0,0,0,.7); }
  .subtitle { font-size: 48px; font-weight: 500; color: #ffcf33; margin-top: 16px; letter-spacing: 3px; }
  @keyframes fade {
    0% { opacity: 0; transform: scale(1.04); }
    12% { opacity: 1; transform: scale(1); }
    88% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.02); }
  }
</style>
</head>
<body>
  <div class="wrap" data-start="0" data-duration="5">
    <div class="title" id="title">Skepticus</div>
    <div class="subtitle" id="subtitle"></div>
  </div>
  <script>
    var P = (window.PROPS || {});
    if (P.title) document.getElementById("title").textContent = P.title;
    if (P.subtitle) document.getElementById("subtitle").textContent = P.subtitle;
  </script>
</body>
</html>
