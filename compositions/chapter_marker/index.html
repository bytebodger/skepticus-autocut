<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
  * { box-sizing: border-box; font-family: "Montserrat", system-ui, sans-serif; }
  .chip {
    position: absolute; top: 80px; right: 120px;
    display: flex; align-items: center; gap: 20px;
    padding: 18px 36px; background: rgba(0,0,0,.72); border-left: 6px solid #ffcf33;
    animation: pop 3.5s ease-out both;
  }
  .num  { font-size: 40px; font-weight: 900; color: #ffcf33; }
  .name { font-size: 40px; font-weight: 600; color: #fff; }
  @keyframes pop {
    0% { opacity: 0; transform: translateY(-20px); }
    8% { opacity: 1; transform: translateY(0); }
    92% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-10px); }
  }
</style>
</head>
<body>
  <div class="chip" data-start="0" data-duration="3.5">
    <span class="num" id="num">01</span>
    <span class="name" id="name">Chapter</span>
  </div>
  <script>
    var P = (window.PROPS || {});
    if (P.number != null) document.getElementById("num").textContent = P.number;
    if (P.name) document.getElementById("name").textContent = P.name;
  </script>
</body>
</html>
